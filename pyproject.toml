[project]
name = "cubature-calculator"
version = "0.1.0"
description = "Offline timber volume calculator"
requires-python = ">=3.13,<3.14"
dependencies = ["flet==0.86.0", "openpyxl>=3.1", "reportlab>=4.0"]

[tool.flet]
org = "com.example"
product = "Кубатура Экспресс"
company = "Sergei Rem"
copyright = "Copyright mechv0d (C) 2026"
# Иконку Flet ищет в каталоге assets как ``icon.png`` (или ``icon.svg``);
# ключ ``icon`` в pyproject.toml эта версия Flet не читает.

[tool.pytest.ini_options]
testpaths = ["tests"]
