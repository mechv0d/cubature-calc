name: Validate and build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python and Flet checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install app and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.86.0" pytest ruff

      - name: Check Python syntax
        run: python -m compileall -q main.py app tests

      - name: Check code quality
        run: ruff check main.py app tests

      - name: Run smoke tests against real Flet controls
        run: python -m pytest -q

  build-apk:
    name: Build APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.86.0"

      - name: Build Android APK
        run: |
          flet build apk --yes --verbose \
            --python-version 3.13 \
            --arch arm64-v8a \
            --build-number "${{ github.run_number }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cubature-calculator-apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 14
